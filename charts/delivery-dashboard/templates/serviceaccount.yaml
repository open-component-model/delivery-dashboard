apiVersion: v1
kind: ServiceAccount
metadata:
  name: delivery-dashboard
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
  labels:
    app: delivery-dashboard
# No RoleBinding/ClusterRoleBinding references this ServiceAccount, so it has no
# API permissions at all (beyond the discovery endpoints every authenticated
# identity gets). The workload never talks to the API server, so no token is
# mounted — disabled here AND at the pod level, either one alone suffices.
automountServiceAccountToken: false
